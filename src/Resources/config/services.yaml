services:
    _defaults:
        autoconfigure: true

    # Inserttag {{meister::...}}
    Schachbulle\ContaoChampionslistsBundle\EventListener\InsertTagsListener:
        tags:
            - { name: contao.hook, hook: replaceInsertTags, method: onReplaceInsertTags }

    # Überführt bestehende Gruppen und Benutzer in die Rechtevergabe je Meisterliste
    Schachbulle\ContaoChampionslistsBundle\Migration\ListPermissionsMigration:
        arguments:
            - '@database_connection'
        tags:
            - { name: contao.migration }
